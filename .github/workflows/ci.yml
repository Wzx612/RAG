name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # CPU wheel from PyTorch's index: the default Linux wheel pulls the CUDA
      # runtime, which this project never uses. The pin must match pyproject.toml.
      - name: Install CPU PyTorch
        run: python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu

      - name: Install project
        run: python -m pip install ".[dev,report,api]"

      - name: Ruff
        run: python -m ruff check src scripts tests

      - name: Mypy
        run: python -m mypy src

      # Database tests skip themselves when no PostgreSQL is reachable
      # (see tests/conftest.py). The real-model tests are deselected here: CI has
      # no model cache and must not spend the job downloading weights. The full
      # suite runs inside the container via `make verify-container`.
      - name: Unit tests
        run: |
          python -m pytest tests -q -p no:cacheprovider \
            --deselect tests/test_dense_benchmark.py::test_real_db_smoke_run_verifies_plans_guc_and_metrics \
            --deselect tests/test_sparse_benchmark.py::test_run_sparse_benchmark_on_two_real_queries \
            --deselect tests/test_sparse_benchmark.py::test_focus_queries_are_extracted_by_id \
            --deselect tests/test_ingestion.py::test_the_real_model_emits_1024_finite_dimensions \
            --deselect tests/test_ingestion.py::test_query_and_document_embeddings_differ_by_the_instruction_prefix \
            --deselect tests/test_ingestion.py::test_every_stored_embedding_has_the_configured_dimension \
            --deselect tests/test_ingestion.py::test_no_stored_embedding_is_a_zero_vector \
            --deselect tests/test_ingestion.py::test_the_document_strategy_covers_the_whole_corpus_exactly_once

name: apex-rag

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${APEX_PG_USER:-apex}
      POSTGRES_PASSWORD: ${APEX_PG_PASSWORD:-apex}
      POSTGRES_DB: ${APEX_PG_DATABASE:-apex_rag}
      # Read by docker/init.sh to size the bootstrap HNSW index.
      APEX_HNSW_M: ${APEX_HNSW_M:-16}
      APEX_HNSW_EF_CONSTRUCTION: ${APEX_HNSW_EF_CONSTRUCTION:-64}
    ports:
      - "${APEX_PG_PORT:-5432}:5432"
    volumes:
      # init.sh is the entrypoint hook; init.sql is its input, kept outside
      # docker-entrypoint-initdb.d so it is not also executed unrendered.
      - ./docker/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
      - ./docker/init.sql:/opt/apex/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APEX_PG_USER:-apex} -d ${APEX_PG_DATABASE:-apex_rag}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  app:
    build: .
    # Behind a profile so `docker compose up -d` brings up the database and
    # nothing else. `docker compose run --rm app ...` still works, and that is
    # how every Makefile target uses this service.
    profiles: ["tools"]
    env_file:
      - path: .env
        required: false          # an empty/missing .env is fine; defaults apply
    environment:
      APEX_PG_HOST: db           # overrides the localhost default for in-network access
      APEX_PG_PORT: 5432
    volumes:
      - ./:/app                  # live source for development
      - hf_cache:/app/.cache/huggingface   # keep downloaded models across runs
    depends_on:
      db:
        condition: service_healthy

  # One-shot download of the embedding and reranker weights into hf_cache, so
  # later runs can be exercised with HF_HUB_OFFLINE=1. No database needed.
  warm-cache:
    build: .
    profiles: ["tools"]
    command: ["python", "scripts/warm_cache.py"]
    env_file:
      - path: .env
        required: false
    volumes:
      - ./:/app
      - hf_cache:/app/.cache/huggingface

  # Read-only HTTP surface. `make api` (or `docker compose --profile api up -d
  # api`) serves it on APEX_API_PORT (default 8000). The models stay lazy: the
  # container starts without loading weights, and /readyz reports the database.
  api:
    build: .
    profiles: ["api"]
    command:
      - uvicorn
      - src.api.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    env_file:
      - path: .env
        required: false
    environment:
      APEX_PG_HOST: db
      APEX_PG_PORT: 5432
      APEX_API_HOST: 0.0.0.0
      APEX_API_PORT: 8000
    ports:
      - "${APEX_API_PORT:-8000}:8000"
    volumes:
      - ./:/app
      - hf_cache:/app/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
  hf_cache:

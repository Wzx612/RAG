[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-rag"
version = "0.1.0"
description = "Vector retrieval and RAG engine for the Apex Card Services agent co-pilot"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# Pinned exactly: the assessment is graded on reproducibility, so a reviewer
# must get the same numbers, not merely compatible ones.
dependencies = [
    "psycopg[binary]==3.3.6",
    "psycopg-pool==3.3.3",
    "pgvector==0.5.1",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "numpy==2.5.4",
    "torch==2.14.1",
    "transformers==5.20.0",
    "sentence-transformers==6.1.0",
    "tabulate==0.10.0",
    "matplotlib==3.11.2",
    "typer==0.27.3",
    "httpx==0.28.1",
]

[project.optional-dependencies]
# Phase 8 (bonus): FastAPI service.
api = ["fastapi==0.143.2", "uvicorn[standard]==0.38.0"]
dev = ["pytest==9.1.1", "ruff==0.17.1", "mypy==2.4.0"]

[tool.setuptools]
packages = [
    "src",
    "src.ingestion",
    "src.retrieval",
    "src.evaluation",
    "src.rag",
    "src.schema",
    "src.utils",
]

# ---------------------------------------------------------------- lint / types
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "D"]
ignore = ["D203", "D213"]  # mutually exclusive docstring conventions

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# B008 is "no function calls in argument defaults", which is exactly how Typer
# declares a CLI parameter: `= typer.Option(...)`. Scoped to the entrypoint so
# the rule still guards the rest of the codebase.
"src/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["sentence_transformers.*", "pgvector.*"]
ignore_missing_imports = true

# ------------------------------------------------------------------- testing
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

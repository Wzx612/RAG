[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-rag"
version = "0.1.0"
description = "Vector retrieval and RAG engine for the Apex Card Services agent co-pilot"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

# Pinned exactly: the assessment is graded on reproducibility, so a reviewer
# must get the same numbers, not merely compatible ones.
dependencies = [
    "psycopg[binary]==3.3.6",
    "psycopg-pool==3.3.3",
    "pgvector==0.5.1",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "numpy==2.5.4",
    # Imported at module level by src/evaluation/rerank_benchmark.py, so it is a
    # hard runtime dependency of the benchmark package, not an optional probe.
    "psutil==7.2.2",
    "torch==2.14.1",
    "transformers==5.20.0",
    "sentence-transformers==6.1.0",
    "typer==0.27.3",
    "httpx==0.28.1",
]

[project.optional-dependencies]
# Phase 8 (bonus): FastAPI service.
api = ["fastapi==0.143.2", "uvicorn[standard]==0.38.0"]
# P1 report rendering: tables and figures. Kept optional so retrieval-only
# installs do not pull a plotting stack. `.[dev,report]` installs everything.
report = ["tabulate==0.10.0", "matplotlib==3.11.2"]
dev = ["pytest==9.1.1", "ruff==0.17.1", "mypy==2.4.0"]

# ------------------------------------------------------------------- uv
[tool.uv.sources]
# Linux and Windows CPU wheels live on PyTorch's own index; macOS CPU wheels
# are on PyPI. Without this mapping uv resolves PyPI's CUDA build, which the
# Dockerfile explicitly avoids.
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.setuptools]
packages = [
    "src",
    "src.api",
    "src.ingestion",
    "src.retrieval",
    "src.evaluation",
    "src.rag",
    "src.schema",
    "src.utils",
]

# ---------------------------------------------------------------- lint / types
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "D"]
ignore = ["D203", "D213"]  # mutually exclusive docstring conventions

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# B008 is "no function calls in argument defaults", which is exactly how Typer
# declares a CLI parameter: `= typer.Option(...)`. Scoped to the entrypoint so
# the rule still guards the rest of the codebase.
"src/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
# Optional/compiled dependencies: the report extra is not installed in every
# environment (CI installs it, a retrieval-only host does not), and mypy must
# not turn that absence into a type error.
module = [
    "sentence_transformers.*",
    "pgvector.*",
    "matplotlib",
    "matplotlib.*",
]
ignore_missing_imports = true

# ------------------------------------------------------------------- testing
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
